name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    name: Plan affected targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_targets: ${{ steps.plan.outputs.has_targets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected target inputs
        id: plan
        run: python3 tools/ci_targets.py

  tests:
    name: Tool tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify review clearance logic
        run: node --test tests/review_gate.mjs
      - name: Run Python tool tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  target:
    name: Validate ${{ matrix.target }}
    needs: [plan, tests]
    if: needs.plan.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      actions: read
    container:
      # Explicit-target layout, verified in n100f-build main run 40560752472.
      # Versions and approved compiler profiles remain unchanged.
      image: ghcr.io/mitsevox/n100f-build@sha256:502c957567a21fd77283fad6d437ae3b6cf19856a8b456157040b6d36cb83773
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      TARGET_ID: ${{ matrix.target }}
    steps:
      - name: Require a repository contribution branch
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: test "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Provide and verify target original
        run: |
          mkdir -p "orig/$TARGET_ID/sys"
          cp "/orig/$TARGET_ID/sys/main.dol" "orig/$TARGET_ID/sys/main.dol"
          python3 tools/verify_target.py --target "$TARGET_ID"
      - name: Configure target
        run: python3 configure.py --version "$TARGET_ID" --dtk /usr/local/bin/dtk --binutils /binutils --compilers /compilers
      - name: Build, verify complete executable and measure progress
        id: measure
        run: |
          ninja -f "build/$TARGET_ID/build.ninja" progress "build/$TARGET_ID/report.json"
          echo "measured-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Check ProDG wrapper against the driver
        env:
          PRODG_DIR: /compilers/ProDG/3.5
          WIBO: build/tools/wibo
        run: python3 -m unittest -v tests/test_prodg_cc.py
      - name: Export public report inputs
        env:
          GH_TOKEN: ${{ github.token }}
          MEASURED_AT: ${{ steps.measure.outputs.measured-at }}
        run: |
          python3 tools/public_report.py inputs --version "$TARGET_ID" \
            --report "build/$TARGET_ID/report.json" --measured-at "$MEASURED_AT" \
            --output "build/$TARGET_ID/public-input"
          python3 tools/public_report.py metadata --version "$TARGET_ID" \
            --measured-at "$MEASURED_AT" --output "build/$TARGET_ID/public-metadata.json"
      - name: Check out pinned site packager
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mitsevox/mitsevox.github.io
          # Consumer-first report-v2 implementation, site PR #32.
          ref: a521c52067490f3ccdfe04c7520a86c5cb04eeda
          path: build/site-tools
          persist-credentials: false
      - name: Set up site packager runtime
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.9'
      - name: Package and validate public report
        run: |
          uv run --locked --project build/site-tools python build/site-tools/tools/package_report.py \
            --input "build/$TARGET_ID/public-input" --metadata "build/$TARGET_ID/public-metadata.json" \
            --policy "config/$TARGET_ID/producer.json" --output "build/$TARGET_ID/public-report"
      - name: Upload public report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: report-v2-${{ matrix.target }}
          path: build/${{ matrix.target }}/public-report/*.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: List measuring tools
        id: tools
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          delimiter="tools-$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "lines<<$delimiter"
            python3 -c "import sys; sys.path.insert(0, 'tools'); import public_report as p; print('\n'.join(t['name'] + '=' + t['identity'] for t in p.tools()))"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - name: Publish to the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        # While report-v2 still feeds the site, its import requires this job to succeed, so a
        # failed schema-1 publish must not fail the job. Removed at the report-v2 cutover.
        continue-on-error: true
        uses: mitsevox/mitsevox.github.io/.github/actions/publish@main
        with:
          target: ${{ matrix.target }}
          report: build/${{ matrix.target }}/report.json
          tools: ${{ steps.tools.outputs.lines }}
          measured-at: ${{ steps.measure.outputs.measured-at }}
          app-client-id: ${{ vars.PORTFOLIO_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}

  complete:
    name: Validate targets
    needs: [plan, tests, target]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PLAN: ${{ needs.plan.result }}
      TESTS: ${{ needs.tests.result }}
      HAS_TARGETS: ${{ needs.plan.outputs.has_targets }}
      TARGETS: ${{ needs.target.result }}
    steps:
      - name: Require all selected target validations
        run: |
          test "$PLAN" = success && test "$TESTS" = success
          if [ "$HAS_TARGETS" = true ]; then test "$TARGETS" = success; else test "$TARGETS" = skipped; fi
