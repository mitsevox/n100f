# No producer code or report artifact is executed by this completion notifier.
name: Notify portfolio
on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
    branches: ["main"]
permissions:
  contents: read
jobs:
  notify:
    if: >-
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/validate.yml'
    uses: mitsevox/mitsevox.github.io/.github/workflows/notify-site.yml@a521c52067490f3ccdfe04c7520a86c5cb04eeda
    with:
      project: n100f
      report_format: report-v2
      producer_branch: "main"
      producer_workflow: ".github/workflows/validate.yml"
      site_repository: "mitsevox/mitsevox.github.io"
      app_client_id: ${{ vars.PORTFOLIO_APP_CLIENT_ID }}
    secrets:
      app_private_key: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}
